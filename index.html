/* =====================
   パスワードハッシュ
===================== */
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

/* =====================
   ユーザー登録
===================== */
async function registerUser() {
  const name = document.getElementById("reg_name").value.trim();
  const password = document.getElementById("reg_password").value;
  const reg_status = document.getElementById("reg_status");

  if (!name || !password) {
    reg_status.textContent = "ユーザー名とパスワードを入力してね。";
    return;
  }

  const hashedPassword = await hashPassword(password);
  const encodedName = encodeURIComponent(name);

  // ★ 修正ポイント：URLエンコード
  const checkRes = await fetch(
    `${url}/rest/v1/users?name=eq.${encodedName}`,
    {
      headers: {
        apikey: KEY,
        Authorization: `Bearer ${KEY}`
      }
    }
  );

  const existingUsers = await checkRes.json();

  if (existingUsers.length > 0) {
    reg_status.textContent = "このユーザー名はすでに使われています。";
    return;

  const res = await fetch(`${url}/rest/v1/users`, {
    method: "POST",

      apikey: KEY,
      Authorization: `Bearer ${KEY}`,

}

/* =====================
   投稿一覧取得
===================== */
async function loadPosts() {
  /* =====================
     投稿取得
  ===================== */
  const postsRes = await fetch(
    `${url}/rest/v1/posts?select=id,message,created_at,user_id,device_id&order=created_at.desc`,
    {
      headers: {
        apikey: KEY,
        Authorization: `Bearer ${KEY}`
      }
    }
  );

  if (!postsRes.ok) {
    alert("投稿取得失敗: " + await postsRes.text());
    return;
  }

  const posts = await postsRes.json();

  /* =====================
     ユーザー取得
  ===================== */
  const usersRes = await fetch(
    `${url}/rest/v1/users?select=id,name,role,is_banned,device_id`,
    {
      headers: {
        apikey: KEY,
        Authorization: `Bearer ${KEY}`
      }
    }
  );

  if (!usersRes.ok) {
    alert("ユーザー取得失敗: " + await usersRes.text());
    return;
  }

  const users = await usersRes.json();

  /* =====================
     BAN端末取得
  ===================== */
  const bannedRes = await fetch(
    `${url}/rest/v1/banned_devices?select=device_id`,
    {
      headers: {
        apikey: KEY,
        Authorization: `Bearer ${KEY}`
      }
    }
  );

  if (!bannedRes.ok) {
    alert("BAN端末取得失敗: " + await bannedRes.text());
    return;
  }

  const bannedDevices = await bannedRes.json();
  const bannedSet = new Set(bannedDevices.map(b => b.device_id));

  /* =====================
     user_id → user map
  ===================== */
  const userMap = {};
  users.forEach(u => {
    userMap[u.id] = u;
  });

  /* =====================
     表示処理
  ===================== */
  const list = document.getElementById("posts");
  list.innerHTML = "";

  posts.forEach(post => {
    const user = userMap[post.user_id];

    // ❌ ユーザー不明
    if (!user) return;

    // ❌ ユーザーBAN
    if (user.is_banned) return;

    // ❌ BAN端末（投稿者）
    if (bannedSet.has(user.device_id)) return;

    // ❌ BAN端末（投稿単位）

    const time = new Date(post.created_at).toLocaleString("ja-JP");

    const role = user.role ?? "未設定";
    const li = document.createElement("li");
li.textContent = `【${time}】${name}（${role}）: `;

// ★ここ追加
if (role === "運営") {

}
    const span = document.createElement("span");
    span.textContent = post.message; 
    span.innerHTML = linkify(span.textContent);

li.appendChild(span);
list.appendChild(li);
  });
}
/* =====================
   URLを[link]に置換する関数
===================== */
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function linkify(text) {
  let escapedText = escapeHtml(text);
  escapedText = escapedText.replace(
    /&lt;\s*(\/?)\s*(h1|h2|br|b|i|s)\b[^&]*?&gt;/gi,
    '<$1$2>'
  );
  const urlRegex = /https?:\/\/[^\s<]+[^<.,:;"')\]\s]/g;
  return escapedText.replace(urlRegex, (url) => {
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: blue;">${url}</a>`;
  });
}
